# Publish this repository's files with GitHub Pages (moglob tile data; plan: https://github.com/danbri/londat/issues/20).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages is switched on by hand (Settings > Pages > Source: GitHub Actions), or here when the org secret
      # MOGLOB_PAGES_TOKEN exists (a fine-grained token, resource owner moglob, Pages and Administration: read and write);
      # the workflow's own token cannot create a Pages site ("Resource not accessible by integration", 2026-11-25)
      - uses: actions/configure-pages@v5
        with:
          enablement: ${{ secrets.MOGLOB_PAGES_TOKEN != '' }}
          token: ${{ secrets.MOGLOB_PAGES_TOKEN || github.token }}
      - name: Stage the site (everything but .git and .github)
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
